<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro - Instituto Esperança</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Instituto Esperança</h1>

      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Seja Voluntário</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Seja um Voluntário</h2>

        <p>
          Preencha o formulário abaixo para demonstrar seu interesse em
          participar das nossas ações.
        </p>
      </section>

      <section>
        <form>
          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" required />

          <br /><br />

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required />

          <br /><br />

          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" required />

          <br /><br />

          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" required />

          <br /><br />

          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" required />

          <br /><br />

          <label for="data">Data de nascimento:</label>
          <input type="date" id="data" name="data" required />

          <br /><br />

          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" required />

          <br /><br />

          <label for="estado">Estado:</label>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="PR">Paraná</option>
            <option value="BA">Bahia</option>
          </select>

          <br /><br />

          <label for="interesse">Área de interesse:</label>

          <select id="interesse" name="interesse" required>
            <option value="">Selecione</option>
            <option value="educacao">Educação</option>
            <option value="alimentos">Distribuição de alimentos</option>
            <option value="eventos">Eventos</option>
            <option value="administrativo">Administrativo</option>
          </select>

          <br /><br />

          <label for="mensagem">Por que deseja ser voluntário?</label>

          <br />

          <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

          <br /><br />

          <label>
            <input type="checkbox" required />
            Concordo com o uso dos meus dados para contato.
          </label>

          <br /><br />

          <button type="submit">Enviar cadastro</button>
        </form>
      </section>
    </main>

    <footer>

      <p>© 2026 Instituto Esperança</p>

    </footer>

    <script src="js/script.js"></script>

  </body>

</html>
